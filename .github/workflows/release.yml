name: Release

# 推送 v* 标签时触发:构建单文件,以 Sleep.html 附加到该标签对应的 Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run doctor
      - run: npm run test:countdown
      - run: npm run build
      - run: npm run check:audio
      - name: 重命名为 Sleep.html
        run: mv dist/index.html Sleep.html
      - run: npm run check:release
      - run: npm run checksum:release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Sleep.html
            Sleep.html.sha256
          body_path: RELEASE_NOTES.md
